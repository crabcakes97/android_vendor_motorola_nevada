[policy_type]
# V1.1
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[mtk-skin-control]
sensor= vtskin1
max_target_tj= 85000
min_target_tj= 85000
trip_tpcb= 78000
target_tpcb= 80000

[vtskin-param]
sensor= vtskin1
operation= coefficient
ref_sensor= [battery,chg_ntc,ap_ntc,quiet_ntc]
ref_coef= [22600000,-8000000,-10000000,89800000]

[thermalhal-threshold]
type= SKIN
sensor= vtskin1
level= [severe, critical, emergency, shutdown]
threshold= [47900, 54000, 97000, 98000]
hysteresis= [2000, 6100, 1000, 1000]

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [ltepa_ntc,chg_ntc,ap_ntc,quiet_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.586142,-0.028646,-0.263986,0.418494]
offset=8287.098037
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [ltepa,chg_ntc,ap_ntc,quiet_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.444727,0.077486,-0.186728,0.294080]
offset=10134.253330
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[mtk-cpu-table-mapping]
mode= enabled
sensor= back_temp
cluster= 0
threshold= [41000, 45000, 48000, 52000]
hysteresis= [2000, 2000, 1000, 2000]
freq= [1800000, 1600000, 1500000, 1400000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= back_temp
cluster= 1
threshold= [38000, 39000, 41000, 45000, 48000]
hysteresis= [1000, 1000, 2000, 2000, 2000]
freq= [2400000, 2200000, 1900000, 1800000, 1700000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= front_temp
threshold= [60000]
hysteresis= [1000]
freq= [976000]

[charger-cooler]
mode= enabled
sensor= back_temp
threshold= [35000, 36000, 37000, 38000, 39000, 42000]
hysteresis= [1000, 1000, 1000, 1000, 1000, 1000]
current= [5800, 5000, 4500, 3000, 2000, 1500]
