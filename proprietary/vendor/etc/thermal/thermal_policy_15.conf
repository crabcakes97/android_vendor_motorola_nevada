[policy_type]
# V1.1
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[mtk-skin-control]
sensor= vtskin1
max_target_tj= 85000
min_target_tj= 85000
trip_tpcb= 78000
target_tpcb= 80000

[vtskin-param]
sensor= vtskin1
operation= coefficient
ref_sensor= [battery,chg_ntc,ap_ntc,quiet_ntc]
ref_coef= [22600000,-8000000,-10000000,89800000]

[thermalhal-threshold]
type= SKIN
sensor= vtskin1
level= [severe, critical, emergency, shutdown]
threshold= [47900, 52000, 97000, 98000]
hysteresis= [2000, 4100, 1000, 1000]

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [ltepa_ntc,chg_ntc,ap_ntc,quiet_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel]
operation= coefficient
coef= [1.096448,-0.033007,-0.179899,0.007991]
offset=3424.625
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= virt_back_temp
ref_sensor= [battery,chg_ntc,ap_ntc,quiet_ntc,tspk_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.461079,0.177872,0.815091,0.532854,-1.079470]
offset=2852.877904
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [ltepa_ntc,chg_ntc,ap_ntc,quiet_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel]
operation= coefficient
coef= [0.887191,-0.337268,0.090771,0.179297]
offset=5027.054509
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= safety_temp
ref_sensor= [battery,chg_ntc,ap_ntc,quiet_ntc,tspk_ntc]
ref_sensor_class=[kernel,kernel,kernel,kernel,kernel]
operation= coefficient
coef=[-0.250098,-0.168823,-0.099741,-0.306771,1.712519]
offset= 3813.040586
trip_sensor= tspk_ntc
trip_sensor_type=kernel
trip_temp= 47000
hysteresis= 2000

[mtk-cpu-table-mapping]
mode= enabled
sensor= back_temp
cluster= 0
threshold= [41000, 42000, 43000, 44000]
hysteresis= [1000, 1000, 1000, 1000]
freq= [1800000, 1600000, 1500000, 1400000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 1
threshold= [40000, 41000, 42000, 43000]
hysteresis= [1000, 1000, 1000, 1000]
freq= [2400000, 1900000, 1800000, 1600000]

[charger-cooler]
mode= enabled
sensor= virt_back_temp
threshold= [36000, 37000, 38000, 39000, 40000, 45000]
hysteresis= [1000, 1000, 1000, 1000, 1000, 4000]
current= [4500, 3000, 2000, 1500, 1000, 1000]


